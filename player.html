<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YouTube Player</title>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#00102b}body{overflow:hidden}</style>
</head>
<body>
  <iframe id="player" title="YouTube動画プレイヤー" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
  <script>
    const videoId = new URLSearchParams(location.search).get('v') || '';
    if (/^[\w-]{11}$/.test(videoId)) {
      const params = new URLSearchParams({ controls: '1', fs: '1', playsinline: '1', rel: '0', origin: location.origin });
      document.querySelector('#player').src = `https://www.youtube.com/embed/${videoId}?${params}`;
    }
  </script>
</body>
</html>
